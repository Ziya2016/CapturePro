name: CaptureProiOS
options:
  bundleIdPrefix: com.capturepro
targets:
  CaptureProiOS:
    type: application
    platform: iOS
    deploymentTarget: "14.0"
    sources:
      - path: .
        excludes:
          - "generate_project.py"
          - "project.yml"
    settings:
      INFOPLIST_FILE: Info.plist
      PRODUCT_BUNDLE_IDENTIFIER: com.capturepro.app
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      SWIFT_VERSION: "5.0"
