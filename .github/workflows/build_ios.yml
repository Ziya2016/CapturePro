name: Build iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_ios:
    name: Build Flutter iOS App
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Verify Flutter installation
        run: flutter --version

      - name: Generate iOS Runner Project
        working-directory: CaptureProiOS
        run: |
          flutter create --platforms=ios --org com.capturepro.photo . --project-name capture_pro

      - name: Get Flutter Dependencies
        working-directory: CaptureProiOS
        run: flutter pub get

      - name: Build iOS (no codesign)
        working-directory: CaptureProiOS
        run: |
          flutter build ios --release --no-codesign

      - name: Package .ipa
        working-directory: CaptureProiOS
        run: |
          APP_PATH=$(find build/ios/iphoneos -name "*.app" | head -1)
          echo "Found app: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r CapturePro_iOS.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CapturePro_iOS_IPA
          path: CaptureProiOS/CapturePro_iOS.ipa
          retention-days: 30
