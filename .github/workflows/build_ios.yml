name: Build iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_ios:
    name: Build Flutter iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Recreate Native iOS Xcode Runner
        run: flutter create --platforms=ios --org com.capturepro.photo .
        working-directory: CaptureProiOS

      - name: Get Flutter Dependencies
        run: flutter pub get
        working-directory: CaptureProiOS

      - name: Build iOS Application
        run: flutter build ios --release --no-codesign
        working-directory: CaptureProiOS

      - name: Package IPA Artifact
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r CapturePro_iOS.ipa Payload
        working-directory: CaptureProiOS

      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CapturePro_iOS_IPA
          path: CaptureProiOS/build/ios/iphoneos/CapturePro_iOS.ipa
