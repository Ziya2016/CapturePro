name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: "📱 Build Capture Pro iOS IPA"
    runs-on: macos-14          # Apple Silicon runner – free for public repos

    steps:

      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: "✅ Checkout repository"
        uses: actions/checkout@v4

      # ── 2. Select Xcode ──────────────────────────────────────────────────────
      - name: "🛠 Select Xcode 15"
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      # ── 3. Generate Xcode project ─────────────────────────────────────────────
      - name: "📂 Generate Xcode project from Python script"
        run: |
          python3 CaptureProiOS/generate_project.py
          echo "✅ project.pbxproj written"

      # ── 4. List what xcodebuild can see ──────────────────────────────────────
      - name: "🔍 List schemes detected by xcodebuild"
        run: |
          xcodebuild -project CaptureProiOS/CaptureProiOS.xcodeproj -list

      # ── 5. Archive (unsigned) ─────────────────────────────────────────────────
      - name: "🏗 Build & Archive (unsigned)"
        run: |
          xcodebuild \
            -project CaptureProiOS/CaptureProiOS.xcodeproj \
            -scheme CaptureProiOS \
            -sdk iphoneos \
            -configuration Release \
            archive \
            -archivePath "$RUNNER_TEMP/CapturePro.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            | xcpretty || true
          echo "✅ Archive step finished"

      # ── 6. Confirm .app was created ───────────────────────────────────────────
      - name: "🔎 Confirm .app exists in archive"
        run: |
          find "$RUNNER_TEMP/CapturePro.xcarchive" -name "*.app" -type d
          APP_PATH=$(find "$RUNNER_TEMP/CapturePro.xcarchive" -name "*.app" -type d | head -1)
          echo "Found app at: $APP_PATH"
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV

      # ── 7. Package into .ipa ──────────────────────────────────────────────────
      - name: "📦 Package .ipa file"
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -r "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -r CapturePro.ipa Payload/
          cp CapturePro.ipa "$GITHUB_WORKSPACE/CapturePro.ipa"
          ls -lh "$GITHUB_WORKSPACE/CapturePro.ipa"
          echo "✅ IPA created successfully"

      # ── 8. Upload artifact ────────────────────────────────────────────────────
      - name: "⬆️ Upload IPA as downloadable artifact"
        uses: actions/upload-artifact@v4
        with:
          name: CapturePro-iOS-Unsigned
          path: CapturePro.ipa
          retention-days: 30
